function card(p){return `<article class="card product-card" onclick="go('detail','${p.id}')"><div class="product-card-top"><div class="row between"><span class="category-icon">${p.icon}</span><span class="badge ${riskClass(p)}">● ${riskLabel(p)}</span></div><div class="row between" style="margin-top:15px;align-items:end"><div><div style="font:700 16px Manrope">${p.name}</div><div class="tiny muted">${p.category} · per ${p.unit}</div></div><div style="text-align:right"><div class="price">${money(p.currentPrice)}</div><div class="price-change ${p.currentPrice>=p.previousPrice?'positive':'negative'}">${change(p)} vs previous</div></div></div></div><div class="product-card-bottom row between"><span class="small muted">Availability <b style="color:var(--ink)">${availabilityName(p.availability)}</b></span><span class="small muted">Risk ${p.riskScore}/100 &nbsp; →</span></div></article>`}
function change(p){const n=(p.currentPrice-p.previousPrice)/p.previousPrice*100;return `${n>=0?'+':''}${n.toFixed(1)}%`};function availabilityName(n){return n>=80?'High':n>=55?'Moderate':'Low'}
function home(){return `<section class="hero"><div class="hero-content"><div class="eyebrow">Supply insight for everyday decisions</div><h1>When supply chains break, prices change.</h1><p>SUPsafe helps you understand why — track supply risks, understand price changes and prepare for disruptions.</p><div class="row"><button class="btn btn-lime" onclick="go('products')">Explore Products →</button><button class="btn btn-light" onclick="runSimulation()">▶ &nbsp;Run Simulation</button></div></div></section><div class="row between wrap"><div class="demo-note"><i class="dot"></i> Demo Data — Not live market information.</div><div class="row location-row"><span class="small muted">Viewing demo for</span><select class="select" onchange="loc.state=this.value;toast('Region set to '+this.value)"><option>Odisha</option><option>West Bengal</option><option>Maharashtra</option><option>All India</option></select><select class="select" onchange="loc.district=this.value"><option>Bhubaneswar</option><option>Balasore</option><option>Cuttack</option><option>Puri</option><option>Sambalpur</option><option>Rourkela</option></select></div></div>${stats()}<div class="section-head"><div><h2>Products to watch</h2><p>Quick view of demo prices and supply status</p></div><button class="btn btn-light btn-small" onclick="go('products')">View all products →</button></div><div class="grid product-grid">${['tomato','oil','rice'].map(id=>card(get(id))).join('')}</div><div class="section-head"><div><h2>See how a disruption spreads</h2><p>Follow the chain from transport disruption to consumer alert.</p></div></div><div class="card row between wrap"><div><strong>Severe rainfall disrupts transportation</strong><div class="small muted" style="margin-top:5px">Run the demo to see availability, price and risk change together.</div></div><button class="btn btn-primary" onclick="runSimulation()">Run supply disruption simulation →</button></div>`}
function productsPage(){return `<div class="eyebrow">Explore the demo catalog</div><h1 class="page-title">Products</h1><p class="sub">Compare demo prices, availability and supply risk across everyday products.</p>${stats()}<div class="toolbar"><div class="searchbox"><span class="search-icon">⌕</span><input class="input" id="search" placeholder="Search for a product…" oninput="filterProducts()"></div><select class="select" id="catFilter" onchange="filterProducts()"><option value="">All categories</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${c}</option>`).join('')}</select><select class="select" id="riskFilter" onchange="filterProducts()"><option value="">All risk levels</option><option>Stable</option><option>Moderate Risk</option><option>High Risk</option></select><select class="select" id="availFilter" onchange="filterProducts()"><option value="">Any availability</option><option>High</option><option>Moderate</option><option>Low</option></select><select class="select" id="priceFilter" onchange="filterProducts()"><option value="">Any price change</option><option value="up">Price increased</option><option value="down">Price decreased</option></select></div><div class="grid product-grid" id="productResults">${products.map(card).join('')}</div><div class="demo-note" style="margin-top:15px">Source: Demo Data · Last Updated: ${now}</div>`}
function filterProducts(){const q=($('#search').value||'').toLowerCase(),cat=$('#catFilter').value,risk=$('#riskFilter').value,av=$('#availFilter').value,pr=$('#priceFilter').value;const list=products.filter(p=>(p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))&&(!cat||p.category===cat)&&(!risk||riskLabel(p)===risk)&&(!av||availabilityName(p.availability)===av)&&(!pr||(pr==='up'?p.currentPrice>=p.previousPrice:p.currentPrice<p.previousPrice)));$('#productResults').innerHTML=list.length?list.map(card).join(''):'<div class="card empty">No products match those filters. Try another search.</div>'}
function detail(){let p=get(selectedId)||get('tomato');let alternatives=p.alternatives.map(a=>{let linked=products.find(x=>x.name.toLowerCase()===a.toLowerCase());return `<div class="alternative" onclick="${linked?`go('detail','${linked.id}')`:`toast('Suggestion only — no catalog price is available')`}"><div class="row between"><strong>${a}</strong><span>→</span></div><div class="tiny muted" style="margin-top:7px">${linked?'View product details':'Suggested substitute'}</div></div>`}).join('');return `<div class="row between wrap"><div><div class="eyebrow">Product details · ${p.category}</div><h1 class="page-title">${p.icon} ${p.name}</h1><div class="demo-note">Source: Demo Data · Last Updated: ${p.lastUpdated}</div></div><button class="btn btn-light" onclick="track('${p.id}')">${tracked.includes(p.id)?'✓ Tracking':'＋ Track this product'}</button></div><div class="grid detail-layout" style="margin-top:18px"><div><div class="card detail-hero"><div class="row between wrap"><div><span class="badge ${riskClass(p)}">● ${riskLabel(p)}</span><div class="detail-price" style="margin-top:12px">${money(p.currentPrice)} <small>/ ${p.unit}</small></div><div class="small muted">Previous price: ${money(p.previousPrice)} / ${p.unit} <b class="${p.currentPrice>=p.previousPrice?'positive':'negative'}">(${change(p)})</b></div></div><div class="risk-score" style="--score:${p.riskScore}"><b>${p.riskScore}</b></div></div><div class="row between" style="margin-top:20px"><span class="small muted">Supply risk score</span><span class="small"><b>${p.riskScore}/100</b> · ${riskLabel(p)}</span></div><div class="progress"><i style="width:${p.riskScore}%;background:${riskClass(p)==='high'?'var(--red)':riskClass(p)==='moderate'?'#d49b31':'var(--green)'}"></i></div><div class="row between small" style="margin-top:12px"><span class="muted">Availability</span><b>${availabilityName(p.availability)} (${p.availability}%)</b></div></div><div class="card" style="margin-top:15px"><div class="row between wrap"><div><h2 style="font:700 16px Manrope;margin:0">Price history</h2><div class="tiny muted" style="margin-top:5px">Demo price trend · ${p.unit}</div></div><div class="range-group"><button class="${range==='7D'?'on':''}" onclick="setRange('7D')">7D</button><button class="${range==='30D'?'on':''}" onclick="setRange('30D')">30D</button><button class="${range==='3M'?'on':''}" onclick="setRange('3M')">3M</button></div></div><div class="chart-wrap"><canvas id="priceChart" aria-label="Product price history chart"></canvas></div><div class="metrics" id="chartMetrics"></div></div></div><div><div class="card"><h2 style="font:700 16px Manrope;margin:0 0 14px">Risk breakdown</h2>${riskBreakdown(p)}<div class="notice" style="margin-top:13px">${p.riskReason}. This score uses demo inputs and is not a verified market assessment.</div><div style="margin-top:15px"><button class="btn btn-primary" style="width:100%" onclick="go('risk')">Open risk calculator →</button></div></div><div class="card" style="margin-top:15px"><div class="row between"><h2 style="font:700 16px Manrope;margin:0">Possible contributing factors</h2><span class="pill">Not confirmed causes</span></div>${['Transportation disruption','Weather conditions','Production changes','Increased demand','Fuel costs'].map((x,i)=>`<div class="factor"><span>${['🚚','🌧','🌱','🛒','⛽'][i]} &nbsp;${x}</span><span class="muted">Possible</span></div>`).join('')}</div><div class="card" style="margin-top:15px"><div class="row between"><h2 style="font:700 16px Manrope;margin:0">Alternatives</h2><button class="btn btn-light btn-small" onclick="go('alternatives')">Find Alternatives →</button></div><div class="grid alt-grid" style="margin-top:12px">${alternatives}</div><p class="tiny muted" style="line-height:1.5">Suggestions may differ in price, taste, nutrition or use. Check suitability for your needs.</p></div></div></div>`}
function riskBreakdown(p){let delta=Math.max(0,(p.currentPrice-p.previousPrice)/p.previousPrice*100), availability=Math.round((100-p.availability)*.4),price=Math.min(30,Math.round(delta*1.2)),shortage=Math.round((100-p.availability)*.2),event=Math.min(10,eventLevel);let sum=availability+price+shortage+event;if(sum===0){availability=4;price=6;shortage=5;sum=15}return [['Availability',availability,40],['Price change',price,30],['Shortage reports',shortage,20],['Disruption events',event,10]].map(x=>`<div class="factor"><span>${x[0]}</span><b>${x[1]} / ${x[2]}</b></div>`).join('')+`<div class="tiny muted" style="margin-top:10px">Weighted components add to ${sum}/100. Product risk score is demo-adjusted.</div>`}
function setRange(r){range=r;render();}
function drawChart(){const c=$('#priceChart');if(!c)return;const rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const p=get(selectedId)||get('tomato');let vals=p.priceHistory.slice(range==='7D'?-7:range==='30D'?-30:-30);if(range==='3M')vals=Array.from({length:90},(_,i)=>{const base=p.priceHistory[i%30];return +(base+(i/89)*p.currentPrice*.06).toFixed(1)});vals[vals.length-1]=p.currentPrice;const w=rect.width,h=rect.height,pad={l:37,r:8,t:12,b:25},lo=Math.min(...vals)*.94,hi=Math.max(...vals)*1.06,x=i=>pad.l+i/(vals.length-1)*(w-pad.l-pad.r),y=v=>pad.t+(hi-v)/(hi-lo)*(h-pad.t-pad.b);ctx.strokeStyle='#e8eee8';ctx.fillStyle='#85938a';ctx.font='10px DM Sans';for(let j=0;j<4;j++){let yy=pad.t+j*(h-pad.t-pad.b)/3;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();let val=hi-j*(hi-lo)/3;ctx.fillText('₹'+val.toFixed(0),0,yy+3)}let grad=ctx.createLinearGradient(0,pad.t,0,h);grad.addColorStop(0,'#3c9b6c35');grad.addColorStop(1,'#3c9b6c00');ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.lineTo(x(vals.length-1),h-pad.b);ctx.lineTo(x(0),h-pad.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.strokeStyle='#25855b';ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle='#25855b';ctx.beginPath();ctx.arc(x(vals.length-1),y(vals.at(-1)),4,0,Math.PI*2);ctx.fill();const pct=(p.currentPrice-vals[0])/vals[0]*100;$('#chartMetrics').innerHTML=[['Current',money(p.currentPrice)],['Previous',money(p.previousPrice)],['Highest',money(Math.max(...vals))],['Lowest',money(Math.min(...vals))]].map(m=>`<div class="metric"><span>${m[0]}</span><strong>${m[1]}</strong></div>`).join('')+`<div class="tiny muted" style="grid-column:1/-1">${range} change: ${pct>=0?'+':''}${pct.toFixed(1)}% · Demo price history</div>`}
function riskPage(){let p=get(selectedId)||get('tomato');return `<div class="eyebrow">Understand the factors behind a risk score</div><h1 class="page-title">Supply Risk Calculator</h1><p class="sub">Adjust the inputs and see a weighted demo estimate. This is an illustrative tool, not a prediction.</p><div class="grid calc-grid" style="margin-top:20px"><div class="card"><div class="field"><label>Product</label><select class="select" style="width:100%" onchange="selectedId=this.value;render()">${products.map(x=>`<option value="${x.id}" ${p.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div>${[['Availability',p.availability,100,'availabilityInput'],['Price change',Math.min(100,Math.max(0,(p.currentPrice-p.previousPrice)/p.previousPrice*100*3)),100,'priceInput'],['Shortage reports',Math.round((100-p.availability)*.25),100,'shortageInput'],['Disruption events',eventLevel*10,100,'eventInput']].map((r,i)=>`<div class="calc-row"><div class="row"><b>${r[0]}</b><span id="${r[3]}Label">${i===0?r[1]+'%':i===1?((p.currentPrice-p.previousPrice)/p.previousPrice*100).toFixed(1)+'%':i===2?Math.round((100-p.availability)*.25)+' reports':'0 events'}</span></div><input type="range" min="0" max="100" value="${r[1]}" oninput="calcRisk()" id="${r[3]}" data-kind="${i}"></div>`).join('')}</div><div class="card"><div class="calc-result"><div class="eyebrow">Estimated supply risk</div><div class="num" id="calcNum">${p.riskScore}</div><span class="badge ${riskClass(p)}" id="calcBadge">${riskLabel(p)}</span><div class="small muted" style="margin-top:10px">out of 100</div></div><h3 style="font:700 14px Manrope;margin:18px 0 8px">Score calculation</h3><div id="calcBreakdown">${riskBreakdown(p)}</div><div class="notice" style="margin-top:14px">Formula weights: availability 40%, price change 30%, shortage reports 20%, disruption events 10%.</div></div></div><div class="notice" style="margin-top:14px">Score bands: 🟢 0–30 Stable &nbsp; 🟡 31–60 Moderate Risk &nbsp; 🔴 61–100 High Risk.</div>`}
function calcRisk(){const vals=[...document.querySelectorAll('.calc-row input')].map(e=>+e.value), avail=Math.round((100-vals[0])*.4),price=Math.round(Math.min(100,vals[1])*.3),short=Math.round(vals[2]*.2),event=Math.round(vals[3]*.1),score=Math.min(100,avail+price+short+event);$('#availabilityInputLabel').textContent=vals[0]+'%';$('#priceInputLabel').textContent=(vals[1]/3).toFixed(1)+'%';$('#shortageInputLabel').textContent=vals[2]+' reports';$('#eventInputLabel').textContent=vals[3]+' events';$('#calcNum').textContent=score;const cl=score<=30?'stable':score<=60?'moderate':'high',label=score<=30?'Stable':score<=60?'Moderate Risk':'High Risk';$('#calcBadge').className='badge '+cl;$('#calcBadge').textContent=label;$('#calcBreakdown').innerHTML=[['Availability',avail,40],['Price change',price,30],['Shortage reports',short,20],['Disruption events',event,10]].map(x=>`<div class="factor"><span>${x[0]}</span><b>${x[1]} / ${x[2]}</b></div>`).join('')}
async function runSimulation(){if(!simOn){simOn=true;let p=get('tomato');p.previousPrice=40;p.currentPrice=52;p.availability=31;p.riskScore=74;p.riskLevel='High Risk';p.riskReason='Simulation: severe rainfall disrupts transportation';p.priceHistory=p.priceHistory.map((v,i)=>i>23?+(v+(i-23)*1.5).toFixed(1):v);eventLevel=8;save()}page='simulation';location.hash='simulation';render();for(let i=0;i<7;i++){await new Promise(r=>setTimeout(r,360));let el=$('#step'+i);if(el)el.classList.add('show')}}
function resetSimulation(){simOn=false;eventLevel=0;products=fresh();save();page='home';location.hash='home';render();toast('Simulation reset. Demo data restored.')}
function simulation(){let p=get('tomato');return `<div class="row between wrap"><div><div class="eyebrow">Interactive scenario</div><h1 class="page-title">Supply Disruption Simulation</h1><p class="sub">Scenario: Severe rainfall disrupts transportation. Watch one possible impact chain unfold.</p></div><button class="btn btn-light" onclick="resetSimulation()">↺ Reset Simulation</button></div><div class="card" style="margin-top:17px"><div class="row between wrap"><div><b>Scenario: Severe rainfall in the region</b><div class="small muted" style="margin-top:5px">Illustrative simulation — not a live forecast or confirmed event.</div></div><span class="badge high">${simOn?'Simulation active':'Ready to run'}</span></div><div class="steps">${[['🚚','Transportation disruption'],['📦','Supply decreases'],['📉','Availability decreases'],['📈','Price increases'],['⚠','Risk score increases'],['🔔','Consumer receives alert'],['🔄','Alternatives suggested']].map((x,i)=>`<div id="step${i}" class="step ${simOn?'show':''}"><b>STEP ${i+1}</b><span>${x[0]}</span><div>${x[1]}</div></div>`).join('')}</div><div class="row wrap"><button class="btn btn-primary" onclick="runSimulation()">▶ &nbsp;${simOn?'Run Again':'Run Supply Disruption Simulation'}</button><button class="btn btn-light" onclick="resetSimulation()">↺ Reset Simulation</button></div></div>${simOn?`<div class="grid detail-layout" style="margin-top:16px"><div class="card"><div class="eyebrow">Tomato · simulation result</div><h2 style="font:700 20px Manrope;margin:8px 0 15px">Before & after</h2><div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div class="metric"><span>Before price</span><strong>₹40/kg</strong><span>Availability: High · Risk: 25</span></div><div class="metric" style="background:#fff0ed"><span>After simulation</span><strong>₹52/kg</strong><span>Availability: Low · Risk: 74</span></div></div><div class="metrics" style="margin-top:10px"><div class="metric"><span>Price change</span><strong class="positive">+30%</strong></div><div class="metric"><span>Availability</span><strong>84% → 31%</strong></div><div class="metric"><span>Risk score</span><strong>25 → 74</strong></div><div class="metric"><span>Alert status</span><strong>Triggered</strong></div></div></div><div class="sim-result"><span class="badge high">● High Risk Alert</span><h2 style="font:700 18px Manrope;margin:13px 0 5px">SUPsafe detected a potential supply risk.</h2><p class="small muted">The scenario raised tomato's demo risk score. This is an illustrative result.</p><button class="btn btn-primary" onclick="go('alternatives','tomato')">Find Alternatives →</button><button class="btn btn-light" style="margin-left:6px" onclick="track('tomato')">Track Tomato</button></div></div>`:''}`}
function alertsPage(){const high=products.filter(p=>p.riskScore>=61),price=products.filter(p=>(p.currentPrice-p.previousPrice)/p.previousPrice>.08);return `<div class="eyebrow">Stay informed</div><h1 class="page-title">Alerts</h1><p class="sub">Demo alerts reflect this sample catalog and your tracked products.</p><div class="grid" style="grid-template-columns:repeat(2,1fr);margin:18px 0">${high.map(p=>`<div class="alert-box"><div class="row between"><span class="badge high">🔴 High Risk Alert</span><span class="tiny muted">Demo</span></div><p style="font-weight:700;margin:12px 0 6px">${p.name} supply risk has increased.</p><p class="small muted">Risk score ${p.riskScore}/100 · ${p.riskReason}</p><button class="btn btn-light btn-small" onclick="track('${p.id}')">${tracked.includes(p.id)?'✓ Tracked':'Track this product'}</button><button class="btn btn-light btn-small" onclick="go('detail','${p.id}')">View product →</button></div>`).join('')}${price.map(p=>`<div class="alert-box amber"><div class="row between"><span class="badge moderate">🟡 Price Alert</span><span class="tiny muted">Demo</span></div><p style="font-weight:700;margin:12px 0 6px">${p.name} has experienced a significant demo price increase.</p><p class="small muted">${money(p.previousPrice)} → ${money(p.currentPrice)} (${change(p)})</p><button class="btn btn-light btn-small" onclick="track('${p.id}')">${tracked.includes(p.id)?'✓ Tracked':'Track this product'}</button><button class="btn btn-light btn-small" onclick="go('detail','${p.id}')">View product →</button></div>`).join('')}</div><div class="card"><div class="row between"><div><h2 style="font:700 17px Manrope;margin:0">Tracked products</h2><div class="tiny muted" style="margin-top:5px">Saved in this browser</div></div></div><div class="grid product-grid" style="margin-top:14px">${tracked.length?tracked.map(id=>get(id)).filter(Boolean).map(card).join(''):'<div class="empty">No tracked products yet. Track a product to keep it handy here.</div>'}</div></div><div class="notice" style="margin-top:13px">Alerts are generated from demo data and simulation inputs. They are not live market notifications.</div>`}
function track(id){tracked=tracked.includes(id)?tracked.filter(x=>x!==id):[...tracked,id];localStorage.setItem('ss_tracked',JSON.stringify(tracked));toast(tracked.includes(id)?get(id).name+' added to tracked products':get(id).name+' removed from tracked products');render()}
function alternativesPage(){let p=get(selectedId)||get('tomato');let ids=p.alternatives;return `<div class="eyebrow">Plan for a disruption</div><h1 class="page-title">Alternative Finder</h1><p class="sub">Explore possible substitutes when a product has limited availability.</p><div class="card" style="margin-top:16px"><div class="row between wrap"><div><div class="small muted">Find alternatives for</div><h2 style="font:700 20px Manrope;margin:5px 0">${p.icon} ${p.name}</h2><span class="badge ${riskClass(p)}">${riskLabel(p)} · Availability ${availabilityName(p.availability)}</span></div><select class="select" onchange="selectedId=this.value;render()">${products.map(x=>`<option value="${x.id}" ${p.id===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="grid alt-grid" style="margin-top:18px">${ids.map(a=>{let prod=products.find(x=>x.name.toLowerCase()===a.toLowerCase());return `<div class="alternative" onclick="${prod?`go('detail','${prod.id}')`:`toast('This is a general suggestion; no price data is available')`}"><div class="row between"><strong>${prod?prod.icon+' ':''}${a}</strong><span>→</span></div><div class="small muted" style="margin-top:8px">${prod?`${money(prod.currentPrice)} / ${prod.unit} · ${availabilityName(prod.availability)} availability`:'General suggestion · No demo price listed'}</div><div class="tiny" style="color:var(--green);margin-top:10px">Why this alternative? It may help cover a similar household or cooking need when the primary product is harder to find.</div></div>`}).join('')}</div><div class="notice" style="margin-top:15px"><b>Suggestions only.</b> Alternatives may not be equivalent in price, taste, nutrition or use. Consider your needs and check product labels.</div></div>`}
function community(){return `<div class="eyebrow">Local observations</div><h1 class="page-title">Community Reports</h1><p class="sub">Share a supply issue you encountered. Reports are unverified and do not establish market facts.</p><div class="grid detail-layout" style="margin-top:17px"><form class="card" onsubmit="submitReport(event)"><h2 style="font:700 17px Manrope;margin:0 0 16px">Report a Supply Problem</h2><div class="grid form-grid"><div class="field"><label>Product</label><select class="select" name="product" required>${products.map(p=>`<option>${p.name}</option>`).join('')}</select></div><div class="field"><label>Location</label><select class="select" name="location"><option>Bhubaneswar, Odisha</option><option>Balasore, Odisha</option><option>Cuttack, Odisha</option><option>Puri, Odisha</option><option>Sambalpur, Odisha</option><option>Rourkela, Odisha</option><option>Other, India</option></select></div><div class="field"><label>Current Price (₹)</label><input class="input" name="current" type="number" min="0" step=".01" placeholder="e.g. 52"></div><div class="field"><label>Previous Price (₹)</label><input class="input" name="previous" type="number" min="0" step=".01" placeholder="e.g. 45"></div><div class="field" style="grid-column:1/-1"><label>Problem Type</label><select class="select" name="type"><option>Shortage</option><option>Price increase</option><option>Product unavailable</option><option>Transportation problem</option><option>Other</option></select></div><div class="field" style="grid-column:1/-1"><label>Description</label><textarea class="textarea" name="description" rows="3" placeholder="What did you notice? Avoid sharing personal information."></textarea></div></div><button class="btn btn-primary" style="margin-top:15px">Submit Report</button><div class="tiny muted" style="margin-top:10px">Reports are stored locally in this browser and labelled unverified.</div></form><div><div class="card"><div class="row between"><h2 style="font:700 17px Manrope;margin:0">Recent reports</h2><span class="pill">${reports.length} report${reports.length===1?'':'s'}</span></div><div class="report-list" style="margin-top:14px">${reports.length?reports.slice().reverse().map(reportCard).join(''):'<div class="empty">No community reports yet. You can add the first one.</div>'}</div></div><div class="notice" style="margin-top:12px">Every entry is marked <b>Unverified Community Report</b>. Reports are not independently checked.</div></div></div>`}
function reportCard(r){return `<div class="report-item"><div class="row between wrap"><b>${r.product} · ${r.type}</b><span class="tag-unverified">Unverified Community Report</span></div><div class="small muted" style="margin-top:7px">${r.location} · ${r.time}</div>${r.current?`<div class="small" style="margin-top:6px">Reported price: ${money(r.current)}${r.previous?' · Previous: '+money(r.previous):''}</div>`:''}${r.description?`<div class="small" style="margin-top:7px">${escapeHtml(r.description)}</div>`:''}</div>`}
function submitReport(e){e.preventDefault();const f=new FormData(e.target);reports.push({product:f.get('product'),location:f.get('location'),current:f.get('current'),previous:f.get('previous'),type:f.get('type'),description:f.get('description'),time:new Date().toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})});localStorage.setItem('ss_reports',JSON.stringify(reports));render();toast('Thank you. Your report has been submitted.')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function business(){const value=inventory.reduce((s,x)=>s+x.quantity*x.purchasePrice,0),low=inventory.filter(x=>x.quantity<x.minimum),high=products.filter(x=>x.riskScore>=61);return `<div class="row between wrap"><div><div class="eyebrow">For small retailers</div><h1 class="page-title">Business Dashboard</h1><p class="sub">Keep an eye on stock value, low inventory and demo supply risk.</p></div><button class="btn btn-light" onclick="go('demo')">⚙ Demo Control Panel</button></div><div class="grid inventory-summary" style="margin:17px 0"><div class="card stat"><div class="stat-label">Total inventory value</div><div class="stat-value">${money(value)}</div><div class="stat-foot">Quantity × purchase price</div></div><div class="card stat"><div class="stat-label">Low-stock products</div><div class="stat-value">${low.length}</div><div class="stat-foot">Below minimum level</div></div><div class="card stat"><div class="stat-label">High-risk products</div><div class="stat-value">${high.length}</div><div class="stat-foot">In demo catalog</div></div></div><div class="grid detail-layout"><form class="card" onsubmit="addInventory(event)"><h2 style="font:700 17px Manrope;margin:0 0 15px">Add inventory item</h2><div class="field"><label>Product</label><select class="select" name="product">${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="grid form-grid" style="margin-top:12px"><div class="field"><label>Quantity</label><input class="input" name="quantity" type="number" min="0" required placeholder="e.g. 12"></div><div class="field"><label>Purchase Price (₹ per unit)</label><input class="input" name="price" type="number" min="0" step=".01" required placeholder="e.g. 140"></div><div class="field"><label>Minimum Stock Level</label><input class="input" name="minimum" type="number" min="0" required placeholder="e.g. 5"></div></div><button class="btn btn-primary" style="margin-top:15px">Add to inventory</button></form><div class="card"><div class="row between"><h2 style="font:700 17px Manrope;margin:0">Products requiring attention</h2><span class="pill">${low.length+high.length}</span></div><div class="inventory-list" style="margin-top:13px">${low.map(x=>`<div class="alert-box amber"><b>⚠ Low Stock</b><div class="small" style="margin-top:5px">${get(x.product)?.name} has fallen below your minimum stock level (${x.quantity} / ${x.minimum}).</div></div>`).join('')}${high.map(p=>`<div class="alert-box"><b>● High Supply Risk</b><div class="small" style="margin-top:5px">${p.name} demo risk is ${p.riskScore}/100.</div></div>`).join('')}${!low.length&&!high.length?'<div class="empty">No items currently need attention.</div>':''}</div></div></div><div class="card" style="margin-top:16px"><div class="row between"><h2 style="font:700 17px Manrope;margin:0">Your inventory</h2><span class="tiny muted">Saved in this browser</span></div><div class="inventory-list" style="margin-top:12px">${inventory.length?inventory.map((x,i)=>`<div class="inventory-item row between wrap"><div><b>${get(x.product)?.name||x.product}</b><div class="tiny muted">${x.quantity} units × ${money(x.purchasePrice)} · Minimum ${x.minimum}</div></div><div class="row"><strong>${money(x.quantity*x.purchasePrice)}</strong><button class="btn btn-light btn-small" onclick="removeInventory(${i})">Remove</button></div></div>`).join(''):'<div class="empty">No inventory yet. Add an item to see its value here.</div>'}</div></div>`}
function addInventory(e){e.preventDefault();const f=new FormData(e.target);inventory.push({product:f.get('product'),quantity:+f.get('quantity'),purchasePrice:+f.get('price'),minimum:+f.get('minimum')});localStorage.setItem('ss_inventory',JSON.stringify(inventory));render();toast('Inventory item added.')};function removeInventory(i){inventory.splice(i,1);localStorage.setItem('ss_inventory',JSON.stringify(inventory));render()}
function learn(){return `<div class="eyebrow">Understand the basics</div><h1 class="page-title">Learn about supply chains</h1><p class="sub">A few simple ideas can help explain why everyday products change in price or availability.</p><div class="grid learn-grid" style="margin-top:18px"><div class="card"><div class="eyebrow">01 · The journey</div><h2 style="font:700 18px Manrope">What is a supply chain?</h2><p class="small muted">A supply chain is the connected journey a product makes from where it is produced to the person who uses it.</p><div class="flow"><span>Producer</span><i>→</i><span>Manufacturer</span><i>→</i><span>Transport</span><i>→</i><span>Wholesaler</span><i>→</i><span>Retailer</span><i>→</i><span>Consumer</span></div></div><div class="card"><div class="eyebrow">02 · When things change</div><h2 style="font:700 18px Manrope">What is a disruption?</h2><p class="small muted">A disruption is an event that delays or interrupts one or more steps. Examples include severe weather, damaged roads, fuel shortages or a sudden rise in demand.</p><div class="notice">One disrupted step can affect products far away from where the event happened.</div></div><div class="card"><div class="eyebrow">03 · Prices and supply</div><h2 style="font:700 18px Manrope">Why might prices increase?</h2><div class="equation">Supply ↓ &nbsp; + &nbsp; Demand same or high<br><span style="color:var(--green)">↓</span><br>Price may increase</div><p class="tiny muted">This is a simplified relationship. Real prices depend on many factors and may not move in a predictable way.</p></div><div class="card"><div class="eyebrow">04 · Example pathway</div><h2 style="font:700 18px Manrope">How one disruption can spread</h2><div class="flow" style="display:grid;grid-template-columns:1fr;justify-items:center"><span>🌧 Cyclone or severe rainfall</span><i>↓</i><span>🚚 Road transportation affected</span><i>↓</i><span>📦 Products arrive late</span><i>↓</i><span>📉 Availability decreases</span><i>↓</i><span>📈 Prices may increase</span></div><button class="btn btn-primary" onclick="runSimulation()">Try this in the simulation →</button></div></div>`}
function about(){return `<div class="hero"><div class="hero-content"><div class="eyebrow">A clearer view of everyday supply</div><h1>Know the disruption. Understand the price. Stay prepared.</h1><p>SUPsafe is a demonstration website that helps consumers and small businesses explore how supply disruptions can affect product availability and prices.</p></div></div><div class="grid learn-grid"><div class="card"><h2 style="font:700 18px Manrope">Our purpose</h2><p class="sub">Make supply-chain risk easier to understand by connecting disruptions, availability, price movement, alerts and possible alternatives in one place.</p></div><div class="card"><h2 style="font:700 18px Manrope">Data transparency</h2><p class="sub">All product prices, risk scores, price history, regional information and alerts on this site are demo data. Community submissions are unverified. Nothing here represents live market information or confirmed causes.</p></div></div>`}
function demoPage(){return `<div class="eyebrow">Presenter tools</div><h1 class="page-title">Demo Control Panel</h1><p class="sub">Change demo product inputs and see the catalog update immediately. Use reset to restore the original sample data.</p><div class="notice" style="margin:15px 0">These controls edit local demo data in this browser only. They do not change market information.</div><div class="grid detail-layout"><div class="card"><div class="field"><label>Product</label><select class="select" id="demoProduct" style="width:100%" onchange="fillDemo()">${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="grid form-grid" style="margin-top:13px"><div class="field"><label>Current Price (₹)</label><input class="input" id="demoPrice" type="number" min="0"></div><div class="field"><label>Availability (%)</label><input class="input" id="demoAvail" type="number" min="0" max="100"></div><div class="field"><label>Risk Level</label><select class="select" id="demoRisk"><option>Stable</option><option>Moderate Risk</option><option>High Risk</option></select></div><div class="field"><label>Stock (units)</label><input class="input" id="demoStock" type="number" min="0" value="20"></div><div class="field"><label>Disruption status</label><select class="select" id="demoDisruption"><option value="0">No disruption</option><option value="1">Transport disruption</option><option value="2">Severe disruption</option></select></div></div><div class="row wrap" style="margin-top:15px"><button class="btn btn-primary" onclick="applyDemo()">Apply changes</button><button class="btn btn-light" onclick="resetSimulation()">Reset all demo data</button></div></div><div class="card"><h2 style="font:700 17px Manrope;margin:0">Current catalog summary</h2><div style="margin-top:15px">${stats()}</div><div class="notice">Inventory stock is saved alongside your business items. Risk level changes update product cards, alerts and dashboard counts.</div><button class="btn btn-light" style="margin-top:14px" onclick="go('business')">Open Business Dashboard →</button></div></div>`}
function fillDemo(){const p=get($('#demoProduct').value);$('#demoPrice').value=p.currentPrice;$('#demoAvail').value=p.availability;$('#demoRisk').value=riskLabel(p);$('#demoStock').value=inventory.find(x=>x.product===p.id)?.quantity??20;$('#demoDisruption').value='0'}function applyDemo(){const p=get($('#demoProduct').value),old=p.currentPrice;p.currentPrice=+$('#demoPrice').value||old;p.previousPrice=old;p.availability=Math.max(0,Math.min(100,+$('#demoAvail').value));const level=$('#demoRisk').value;p.riskScore=level==='Stable'?25:level==='Moderate Risk'?50:75;p.riskLevel=level;p.riskReason='Updated with presenter demo controls';p.priceHistory.push(p.currentPrice);p.priceHistory=p.priceHistory.slice(-30);eventLevel=+$('#demoDisruption').value*4;const stock=+$('#demoStock').value,existing=inventory.find(x=>x.product===p.id);if(existing){existing.quantity=stock;existing.purchasePrice=p.currentPrice}else inventory.push({product:p.id,quantity:stock,purchasePrice:p.currentPrice,minimum:5});localStorage.setItem('ss_inventory',JSON.stringify(inventory));save();render();toast('Demo data and stock updated across the dashboard.')}
const forecastData={Bhubaneswar:[{icon:'🌦️',summary:'Passing showers',rain:14,wind:18},{icon:'🌧️',summary:'Heavy afternoon rain',rain:46,wind:31},{icon:'⛅',summary:'Clouds clearing',rain:8,wind:14}],Balasore:[{icon:'🌧️',summary:'Coastal rain bands',rain:39,wind:35},{icon:'🌧️',summary:'Heavy rain likely',rain:58,wind:42},{icon:'🌦️',summary:'Scattered showers',rain:21,wind:24}],Cuttack:[{icon:'🌦️',summary:'Showers nearby',rain:22,wind:20},{icon:'🌧️',summary:'Periods of heavy rain',rain:43,wind:33},{icon:'☀️',summary:'Mostly clear',rain:4,wind:12}],Puri:[{icon:'🌧️',summary:'Windy coastal showers',rain:31,wind:39},{icon:'🌧️',summary:'Heavy coastal rain',rain:51,wind:47},{icon:'🌦️',summary:'Light showers',rain:16,wind:27}],Sambalpur:[{icon:'⛅',summary:'Cloudy, isolated rain',rain:11,wind:16},{icon:'🌦️',summary:'Showers developing',rain:28,wind:23},{icon:'🌧️',summary:'Heavy rain possible',rain:42,wind:30}],Rourkela:[{icon:'🌦️',summary:'Scattered showers',rain:17,wind:21},{icon:'⛅',summary:'Cloudy breaks',rain:9,wind:15},{icon:'🌧️',summary:'Rain likely',rain:37,wind:29}]};
const dayNames=['Today','Tomorrow','Day 3'];function outlook(){return (forecastData[weatherCity]||forecastData.Bhubaneswar)[weatherDay]};function setWeatherDay(i){weatherDay=i;render()}function setWeatherCity(c){weatherCity=c;weatherDay=0;render()}
function transportStatus(mm){return mm>=35?{label:'Delays possible',cls:'high',icon:'⚠'}:mm>=18?{label:'Slower routes possible',cls:'moderate',icon:'↗'}:{label:'Routes look clear',cls:'stable',icon:'✓'}}
function weatherWidget(){const f=outlook(),status=transportStatus(f.rain),days=(forecastData[weatherCity]||forecastData.Bhubaneswar);return `<section class="card" style="margin-top:20px;padding:0;overflow:hidden"><div class="weather-hero"><div class="row between wrap"><div><div class="eyebrow">Regional outlook · Demo forecast</div><h2 style="font:800 23px Manrope;margin:7px 0">Weather & transport</h2><div class="sub">${weatherCity}, Odisha · ${dayNames[weatherDay]} · illustrative forecast</div></div><div class="row"><span class="badge weather-chip">Not live weather data</span><button class="btn btn-lime btn-small" onclick="go('weather')">Full forecast →</button></div></div></div><div style="padding:17px 20px 20px"><div class="grid weather-grid">${days.map((d,i)=>`<div class="card forecast-day ${i===weatherDay?'selected':''}" style="padding:15px;cursor:pointer" onclick="setWeatherDay(${i})"><div class="row between"><b class="small">${dayNames[i]}</b><span class="forecast-icon">${d.icon}</span></div><div style="font-weight:700;margin:7px 0 11px">${d.summary}</div><div class="row between tiny muted"><span>🌧 ${d.rain} mm</span><span>💨 ${d.wind} km/h</span></div><div class="rain-meter" style="margin-top:9px"><i style="width:${Math.min(100,d.rain*1.5)}%"></i></div></div>`).join('')}</div><div class="weather-impact row between wrap" style="margin-top:13px"><div class="transport-line"><span class="badge ${status.cls}">${status.icon} ${status.label}</span><span><b>Transport watch</b><br><span class="muted">Heavy rain can slow roads and delay fresh deliveries.</span></span></div><div class="row wrap"><span class="product-count-pill">Potentially sensitive: produce · seafood</span><button class="btn btn-primary btn-small" onclick="runSimulation()">Try disruption simulation →</button></div></div><div class="tiny muted" style="margin-top:11px">Demo forecast only. Rainfall is illustrative; route conditions and product effects are not verified or predictive.</div></div></section>`}
function weatherPage(){return `<div class="eyebrow">Odisha · regional demo</div><h1 class="page-title">Weather & transportation outlook</h1><p class="sub">Explore a fictional three-day forecast and see how heavy rainfall could create delivery delays in a supply-chain scenario.</p><div class="row between wrap" style="margin:16px 0"><div class="row"><span class="small muted">Location</span><select class="select" onchange="setWeatherCity(this.value)">${Object.keys(forecastData).map(c=>`<option ${c===weatherCity?'selected':''}>${c}</option>`).join('')}</select></div><span class="badge moderate">Demo forecast — not live weather</span></div>${weatherWidget()}<div class="grid detail-layout" style="margin-top:15px"><div class="card"><div class="eyebrow">Why weather matters to transport</div><h2 style="font:700 18px Manrope;margin:8px 0">A possible disruption pathway</h2><div class="flow" style="display:grid;grid-template-columns:1fr;justify-items:start"><span>🌧️ Heavy rainfall in ${weatherCity}</span><i>↓</i><span>🚚 Some roads may slow or close in a scenario</span><i>↓</i><span>📦 Fresh goods could arrive later</span><i>↓</i><span>📉 Availability may fall locally</span><i>↓</i><span>🔔 Risk signals may rise</span></div><div class="notice">This is a teaching scenario. It does not report actual road closures or predict local prices.</div></div><div class="card"><div class="eyebrow">Products to keep an eye on</div><h2 style="font:700 18px Manrope;margin:8px 0 13px">Perishable demo products</h2>${['tomato','banana','fish','milk'].map(id=>{let p=get(id);return `<div class="factor"><span>${p.icon} ${p.name}</span><span class="badge ${riskClass(p)}">${riskLabel(p)}</span></div>`}).join('')}<p class="tiny muted" style="line-height:1.5;margin-top:12px">These products are shown as examples of goods that may be sensitive to delivery timing. Their displayed scores are demo inputs and are not calculated from the forecast.</p><button class="btn btn-primary" onclick="runSimulation()">Run the rainfall disruption simulation →</button></div></div>`}
function render(){if(!document.querySelector('.navlinks a[href="#weather"]'))$('#navlinks').insertAdjacentHTML('beforeend','<a href="#weather">Weather</a>');navActive();let html=({home,products:productsPage,detail,risk:riskPage,simulation,alerts:alertsPage,alternatives:alternativesPage,community,business,learn,weather:weatherPage,about:about,demo:demoPage})[page];if(!html){page='home';html=home}app.innerHTML=html();if(page==='home'||page==='simulation')app.insertAdjacentHTML('beforeend',weatherWidget());navActive();if(page==='detail')requestAnimationFrame(drawChart);if(page==='demo')fillDemo()}
const initialRoute=location.hash.slice(1);if(initialRoute.startsWith('product/')){page='detail';selectedId=initialRoute.split('/')[1]}else if(initialRoute)page=initialRoute;
render();
</script></body></html>
